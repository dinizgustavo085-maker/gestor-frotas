# Copie este arquivo para application.properties e preencha com seus dados locais.
spring.application.name=gestao-transportes

# Banco MySQL local
spring.datasource.url=jdbc:mysql://localhost:3306/gestor_frotas?sslMode=DISABLED
spring.datasource.username=seu_usuario
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Para banco remoto com SSL, use algo neste formato:
# spring.datasource.url=jdbc:mysql://host:porta/defaultdb?sslMode=REQUIRED

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
